<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Medication Scheduler</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script>redirectIfLoggedIn();</script>
</head>
<body>

  <main class="auth-page">
    <section class="card auth-card">
      <h1>💊 Create an Account</h1>

      <div class="medicine-line" aria-hidden="true">
        <svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="capLeftHalf">
              <rect x="0" y="0" width="30" height="30"></rect>
            </clipPath>
          </defs>
          <g transform="translate(10,12)">
            <rect x="5" y="15" width="30" height="40" rx="6" fill="#ba68c8"></rect>
            <rect x="10" y="4" width="20" height="12" rx="3" fill="#8e24aa"></rect>
            <rect x="9" y="28" width="22" height="10" fill="#ffffff" opacity="0.85"></rect>
          </g>
          <g transform="translate(110,25)">
            <rect width="60" height="30" rx="15" ry="15" fill="#66bb6a"></rect>
            <rect width="30" height="30" rx="15" ry="15" fill="#ffffff" clip-path="url(#capLeftHalf)"></rect>
          </g>
          <g transform="translate(220,20)">
            <ellipse cx="20" cy="30" rx="20" ry="8" fill="#4dd0e1"></ellipse>
            <ellipse cx="20" cy="21" rx="20" ry="8" fill="#26c6da"></ellipse>
            <ellipse cx="20" cy="12" rx="20" ry="8" fill="#00acc1"></ellipse>
          </g>
        </svg>
      </div>

      <form id="signup-form">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" placeholder="Choose a username">

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Choose a password">

        <label for="signup-confirm">Confirm Password</label>
        <input type="password" id="signup-confirm" placeholder="Re-enter password">

        <p id="signup-error" class="error-text"></p>

        <button type="submit">Sign Up</button>
      </form>

      <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="signup.js"></script>
</body>
</html>
