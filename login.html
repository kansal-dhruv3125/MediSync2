<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log In - Medication Scheduler</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
  <script>redirectIfLoggedIn();</script>
</head>
<body>

  <main class="auth-page">
    <section class="card auth-card">
      <h1>💊 Log In</h1>

      <div class="medicine-line" aria-hidden="true">
        <svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="capLeftHalf">
              <rect x="0" y="0" width="30" height="30"></rect>
            </clipPath>
          </defs>
          <g transform="translate(10,12)">
            <rect x="5" y="15" width="30" height="40" rx="6" fill="#4fc3f7"></rect>
            <rect x="10" y="4" width="20" height="12" rx="3" fill="#0288d1"></rect>
            <rect x="9" y="28" width="22" height="10" fill="#ffffff" opacity="0.85"></rect>
          </g>
          <g transform="translate(110,25)">
            <rect width="60" height="30" rx="15" ry="15" fill="#ff6b6b"></rect>
            <rect width="30" height="30" rx="15" ry="15" fill="#ffffff" clip-path="url(#capLeftHalf)"></rect>
          </g>
          <g transform="translate(220,20)">
            <ellipse cx="20" cy="30" rx="20" ry="8" fill="#ffd54f"></ellipse>
            <ellipse cx="20" cy="21" rx="20" ry="8" fill="#ffca28"></ellipse>
            <ellipse cx="20" cy="12" rx="20" ry="8" fill="#ffb300"></ellipse>
          </g>
        </svg>
      </div>

      <form id="login-form">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Your username">

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Your password">

        <p id="login-error" class="error-text"></p>

        <button type="submit">Log In</button>
      </form>

      <p class="switch-link">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
